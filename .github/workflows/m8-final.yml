name: M8 final
on:
  push:
    branches: [feature/shipping-foundation-fixed]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Remove threshold UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/app/admin/settings/page.tsx')
          s=p.read_text()
          s=re.sub(r'\s*<Field label="Free Shipping Threshold".*?</Field>\n', '\n', s, flags=re.S)
          p.write_text(s)
          PY
          rm -f .github/workflows/m8-final.yml
      - name: Verify
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npm run test:unit
          npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "M8 remove legacy shipping threshold UI"
          git push
